name: CI

on:
    pull_request:
    workflow_dispatch:
    push:
        branches: [next, main]

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    checks:
        name: Checks
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Install browsers
              run: pnpm exec playwright install --with-deps chromium firefox webkit

            - name: Type-check the scripts
              run: pnpm check-types:scripts

            - name: Check the registry catalog
              run: pnpm registry:check

            - name: Format
              run: pnpm format:check

            - name: Build the packages
              run: pnpm build:lib

            # Type-aware lint reads the sibling packages' types from their dist, so it runs after the build.
            - name: Lint
              run: pnpm lint

            - name: Type-check and test every package
              run: pnpm turbo check-types test:all

            - name: Build the docs
              run: pnpm build:docs

            - name: Docs end-to-end tests
              run: pnpm test:e2e:docs

    zod-floor:
        name: Zod floor
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Install browsers
              run: pnpm exec playwright install --with-deps chromium firefox webkit

            # The packages declare zod ^4.5.0 as a peer. This installs that floor itself, uncommitted, so a use of a newer Zod API fails here.
            - name: Install the lowest supported Zod
              run: |
                  node -e "const fs = require('node:fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); pkg.pnpm.overrides.zod = '4.5.0'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, '\t'));"
                  pnpm install --no-frozen-lockfile
                  node -e "const v = require('zod/package.json').version; if (v !== '4.5.0') { console.error('Expected zod 4.5.0, got ' + v); process.exit(1); }"

            - name: Type-check and test the packages that use Zod
              run: >-
                  pnpm turbo check-types test:all
                  --filter=@schema-engine/registry
                  --filter=@schema-engine/actions
                  --filter=@schema-engine/layout
                  --filter=@schema-engine/forms
                  --filter=@schema-engine/forms-react
                  --filter=@schema-engine/forms-radiant

    storybook:
        name: Storybook
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v6

            - uses: actions/setup-node@v5
              with:
                  node-version: '24'
                  cache: 'pnpm'

            - name: Install
              run: pnpm install --frozen-lockfile

            - name: Install Chromium
              run: pnpm exec playwright install --with-deps chromium

            - name: Build the React Storybook
              run: pnpm build:react-storybook

            - name: Build the Radiant Storybook
              run: pnpm build:radiant-storybook

            - name: Radiant Storybook tests
              run: pnpm turbo test:storybook --filter=@schema-engine/forms-radiant
